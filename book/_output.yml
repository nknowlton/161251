bookdown::gitbook:
  number_sections: false
  css: [sandstone.css, style.css]
  split_by: chapter
  pandoc_args:
    - "--lua-filter=filters/lecture-numbers.lua"
    - "--lua-filter=filters/remove-slide-pauses.lua"
  includes:
    in_header: ../shared/book-header.html
  config:
    toc:
      collapse: section
    toolbar:
      position: static
    edit: null
    download: null
    fontsettings:
      theme: sepia
      family: sans
      size: 2
    sharing:
      github: no
      facebook: no
      twitter: no
      linkedin: no
      weibo: no
      instapaper: no
      pocket: no
      all: no
bookdown::pdf_book:
  pandoc_args:
    - "--lua-filter=filters/remove-slide-pauses.lua"
  includes:
    in_header: preamble.tex
  latex_engine: xelatex
  citation_package: natbib
bookdown::epub_book:
  pandoc_args:
    - "--lua-filter=filters/remove-slide-pauses.lua"
  stylesheet: style.css
