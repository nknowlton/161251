name: Build & Deploy Book

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/configure-pages@v6

      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: release
          use-public-rspm: true

      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          dependencies: '"hard"'
          packages: |
            tidyverse
            broom
            knitr
            formatR
            rmarkdown
            bookdown
            tsibble
            fable
            feasts
            lubridate
            DescTools
            car
            emmeans
            nlme
            lmtest
            glmnet
            patchwork
            kableExtra
            gridExtra
            GGally
            broom.mixed

      - name: Set up Quarto
        run: |
          if dpkg -s quarto >/dev/null 2>&1; then
            sudo apt-get remove -y quarto
          fi

      - name: Install pinned Quarto
        uses: quarto-dev/quarto-actions/setup@v2
        with:
          version: 1.10.14

      - name: Build interactive OJS widgets
        run: quarto render widgets --no-clean

      - name: Test widget calculations
        run: |
          node widgets/tests/labs.test.mjs
          node widgets/tests/ui.test.mjs

      - name: Validate course structure
        run: Rscript scripts/validate-course.R

      - name: Build bookdown
        run: Rscript scripts/render-book.R

      - name: Generate slide wrappers
        run: Rscript scripts/generate-slide-wrappers.R

      - name: Build Slidy presentations
        run: Rscript scripts/render-slides.R all slidy

      - name: Generate student .Rmd files
        run: Rscript scripts/generate-student-rmd.R

      - name: Assemble Pages artifact
        run: Rscript scripts/assemble-site.R

      - name: Move site to _site for Pages
        run: |
          rm -rf _site
          cp -r build/site/161251 _site

      - name: Verify Pages artifact
        run: |
          required=(
            _site/index.html
            _site/notes/index.html
            _site/slides/index.html
            _site/labs/index.html
            _site/widget/index.html
            _site/labs/lab10.Rmd
            _site/labs/lab11A.Rmd
            _site/labs/lab11B.Rmd
            _site/labs/lab12.Rmd
            _site/labs/lab12.html
            _site/labs/lab12-sols.Rmd
            _site/labs/lab12-sols.html
          )

          for file in "${required[@]}"; do
            test -f "$file"
          done

          test "$(find _site/notes/downloads -maxdepth 1 -name '*.Rmd' | wc -l)" -gt 0
          expected_slides="$(awk -F, 'NR > 1 && tolower($7) == "yes" { count++ } END { print count + 0 }' course/lectures.csv)"
          actual_slides="$(find _site/slides -mindepth 2 -maxdepth 2 -type f -name '*.html' | wc -l)"
          test "$actual_slides" -eq "$expected_slides"
          test "$(grep -c 'class=\"slide-link\"' _site/slides/index.html)" -eq "$expected_slides"
          grep -q 'href="slides/"' _site/index.html
          grep -q 'href="lab12.html"' _site/labs/index.html
          ! grep -Eq -- 'lab12[AB]\.' _site/labs/index.html

      - uses: actions/upload-pages-artifact@v5
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
